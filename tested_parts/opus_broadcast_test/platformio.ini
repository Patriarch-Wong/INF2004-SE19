; One-to-many Opus broadcast over ESP-NOW (ESP32-S3 N16R8). One firmware for
; every board: whichever board is told to send broadcasts a stream, and the
; others receive it. No encryption and no keys.
[platformio]
default_envs = broadcast

[env]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
upload_speed = 460800
; These boards require manual BOOT + RESET before uploading.
board_upload.before_reset = no_reset

; Quad-SPI flash + Octal-SPI PSRAM. Override the stock N8 board defaults.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM

lib_deps =
    https://github.com/pschatzmann/arduino-libopus.git#bae0f8570b03071d0101445059e7178bed8bd144

; Serial over the USB-to-UART bridge (usually the UART connector).
[env:broadcast]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
