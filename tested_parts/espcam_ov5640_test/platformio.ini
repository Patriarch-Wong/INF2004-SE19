; OV5640 camera test. Two board pin maps: a generic ESP32-S3 N16R8 CAM board
; (Freenove ESP32-S3-WROOM CAM pinout) and the AI-Thinker ESP32-CAM.
[platformio]
default_envs = esp32s3-cam

[env]
; Pinned to the PlatformIO platform installed when this template was created.
platform = espressif32@7.1.3
framework = arduino

monitor_speed = 2000000
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
upload_speed = 460800

; 2 Mbaud so camera frames fit through the USB-to-UART bridge (CH343).
build_flags =
    -DBOARD_HAS_PSRAM
    -DSERIAL_BAUD=2000000

lib_deps =

; ESP32-S3 N16R8: Quad-SPI flash + Octal-SPI PSRAM.
[s3]
board = esp32-s3-devkitc-1
; These boards require manual BOOT + RESET before uploading.
board_upload.before_reset = no_reset
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
build_flags =
    ${env.build_flags}
    -DCAM_BOARD_S3_WROOM=1

; Default: Serial uses the USB-to-UART bridge (usually the UART connector).
[env:esp32s3-cam]
extends = s3
build_flags =
    ${s3.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

; Alternative: Serial uses the chip's native USB Serial/JTAG controller.
[env:esp32s3-cam-usb]
extends = s3
build_flags =
    ${s3.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; Classic AI-Thinker ESP32-CAM (ESP32, 4 MB flash, 4 MB PSRAM), flashed
; through an ESP32-CAM-MB or USB-UART adapter (IO0 to GND to flash).
[env:ai-thinker-esp32cam]
board = esp32cam
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DCAM_BOARD_AI_THINKER=1
