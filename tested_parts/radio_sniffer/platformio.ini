; Keyless passive radio sniffer (ESP32-S3 N16R8): captures ESP-NOW frames
; with Wi-Fi promiscuous mode and LoRa packets with a Core1121 (LR1121),
; both at once, and prints every capture on serial. It holds no keys,
; links no crypto, and never transmits.
[platformio]
default_envs = sniffer

[env]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
upload_speed = 460800
; These boards require manual BOOT + RESET before uploading.
board_upload.before_reset = no_reset

; Quad-SPI flash + Octal-SPI PSRAM. Override the stock N8 board defaults.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    jgromes/RadioLib@7.7.1

; Serial on the USB-to-UART connector.
[env:sniffer]
