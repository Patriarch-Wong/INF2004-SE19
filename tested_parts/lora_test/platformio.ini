; Reusable Arduino template for ESP32-S3 N16R8 (16 MB flash, 8 MB PSRAM).
[platformio]
default_envs = esp32-s3-n16r8

[env]
; Pinned to the PlatformIO platform installed when this template was created.
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
; Timestamp serial output and save it on the computer while monitoring.
monitor_filters =
    esp32_exception_decoder
    time
    log2file
upload_speed = 460800

; Quad-SPI flash + Octal-SPI PSRAM. Override the stock N8 board defaults.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM

; Add project libraries here, preferably with explicit versions.
lib_deps =
    jgromes/RadioLib@7.7.1

; Default: Serial uses the USB-to-UART bridge (usually the UART connector).
[env:esp32-s3-n16r8]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

; Alternative: Serial uses the chip's native USB Serial/JTAG controller.
; The base board definition already sets ARDUINO_USB_MODE=1.
[env:esp32-s3-n16r8-usb]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; Role is now selected manually with LORA_INITIATOR in src/main.cpp.
; The old automatic-role environments are commented out for reference.
; To restore them, also wrap main.cpp's define in #ifndef LORA_INITIATOR / #endif.
; [env:lora-a]
; extends = env:esp32-s3-n16r8
; build_flags = ${env:esp32-s3-n16r8.build_flags} -DLORA_INITIATOR=1
;
; [env:lora-b]
; extends = env:esp32-s3-n16r8
; build_flags = ${env:esp32-s3-n16r8.build_flags} -DLORA_INITIATOR=0
;
; [env:lora-a-usb]
; extends = env:esp32-s3-n16r8-usb
; build_flags = ${env:esp32-s3-n16r8-usb.build_flags} -DLORA_INITIATOR=1
