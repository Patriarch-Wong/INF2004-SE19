; ESP-NOW audio for two ESP32-S3 N16R8 boards.
[platformio]
default_envs = mic_tx, speaker_rx

[env]
; Pinned to the PlatformIO platform installed when this template was created.
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

; Quad-SPI flash + Octal-SPI PSRAM. Override the stock N8 board defaults.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM

; Add project libraries here, preferably with explicit versions.
lib_deps =

; Default: Serial uses the USB-to-UART bridge (usually the UART connector).
[env:mic_tx]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DAUDIO_TRANSMITTER=1

[env:speaker_rx]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DAUDIO_TRANSMITTER=0

; Alternative: Serial uses the chip's native USB Serial/JTAG controller.
; The base board definition already sets ARDUINO_USB_MODE=1.
[env:mic_tx_usb]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DAUDIO_TRANSMITTER=1

[env:speaker_rx_usb]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DAUDIO_TRANSMITTER=0
