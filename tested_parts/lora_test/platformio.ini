; One firmware for every board: broadcast and listen between transmissions.
[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
; Pinned to the PlatformIO platform installed when this template was created.
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
; Keep the monitor's control lines inactive when opening the UART port.
monitor_dtr = 0
monitor_rts = 0
; Timestamp serial output and save it on the computer while monitoring.
monitor_filters =
    esp32_exception_decoder
    time
    log2file
upload_speed = 460800

; Quad-SPI flash + Octal-SPI PSRAM. Override the stock N8 board defaults.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial uses the USB-to-UART bridge. Set to 1 for native USB serial.
    -DARDUINO_USB_CDC_ON_BOOT=0

; Add project libraries here, preferably with explicit versions.
lib_deps =
    jgromes/RadioLib@7.7.1
