; Mic to speaker over the encrypted link (ESP32-S3 N16R8): one board's
; MAX9814 microphone, another board's PDM speaker, design-review pins,
; push-to-talk Opus voice end-to-end encrypted. Keys are compiled in
; (tools/generate_keys.py), so there is no pairing step. Both boards run the
; same firmware; build the environment for the board's ID.
[platformio]
default_envs = board1, board2

[env]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
upload_speed = 460800
; These boards require manual BOOT + RESET before uploading.
board_upload.before_reset = no_reset

; Quad-SPI flash + Octal-SPI PSRAM. Override the stock N8 board defaults.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    https://github.com/pschatzmann/arduino-libopus.git#bae0f8570b03071d0101445059e7178bed8bd144

[env:board1]
build_flags = ${env.build_flags} -DE2E_DEVICE_ID=1

[env:board2]
build_flags = ${env.build_flags} -DE2E_DEVICE_ID=2
