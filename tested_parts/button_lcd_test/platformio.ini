; Button, external LED, and ST7789 LCD on ESP32-S3 N16R8.
[platformio]
default_envs = esp32-s3-n16r8

[env]
; Pinned to the PlatformIO platform installed when this template was created.
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
upload_speed = 460800
; These boards require manual BOOT + RESET before uploading.
board_upload.before_reset = no_reset

; Quad-SPI flash + Octal-SPI PSRAM. Override the stock N8 board defaults.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -fno-exceptions
    -fno-rtti

; Add project libraries here, preferably with explicit versions.
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    bodmer/TJpg_Decoder@1.1.0

; Default: Serial uses the USB-to-UART bridge (usually the UART connector).
[env:esp32-s3-n16r8]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

; Alternative: Serial uses the chip's native USB Serial/JTAG controller.
; The base board definition already sets ARDUINO_USB_MODE=1.
[env:esp32-s3-n16r8-usb]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
