; ESP-NOW end-to-end encryption and authentication test (ESP32-S3 N16R8).
; Each board is built for its own device ID so it holds only its pair keys.
[platformio]
default_envs = board1, board2

[env]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
upload_speed = 460800
; These boards require manual BOOT + RESET before uploading.
board_upload.before_reset = no_reset

; Quad-SPI flash + Octal-SPI PSRAM. Override the stock N8 board defaults.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM

lib_deps =

; Serial over the USB-to-UART bridge (usually the UART connector).
[uart]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

; Serial over the chip's native USB Serial/JTAG controller.
[usb]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:board1]
build_flags = ${uart.build_flags} -DE2E_DEVICE_ID=1

[env:board2]
build_flags = ${uart.build_flags} -DE2E_DEVICE_ID=2

[env:board3]
build_flags = ${uart.build_flags} -DE2E_DEVICE_ID=3

[env:board1-usb]
build_flags = ${usb.build_flags} -DE2E_DEVICE_ID=1

[env:board2-usb]
build_flags = ${usb.build_flags} -DE2E_DEVICE_ID=2

[env:board3-usb]
build_flags = ${usb.build_flags} -DE2E_DEVICE_ID=3

; Negative tests: flash the named board with one of these and the others
; with their normal environment. See README.md for the expected results.
[env:board1-tamper]
build_flags = ${env:board1.build_flags} -DE2E_TEST_TAMPER

[env:board1-forge]
build_flags = ${env:board1.build_flags} -DE2E_TEST_FORGE

[env:board1-replay]
build_flags = ${env:board1.build_flags} -DE2E_TEST_REPLAY

; Device 3 sends to device 2 claiming to be device 1.
[env:board3-impersonate]
build_flags = ${env:board3.build_flags} -DE2E_TEST_IMPERSONATE
