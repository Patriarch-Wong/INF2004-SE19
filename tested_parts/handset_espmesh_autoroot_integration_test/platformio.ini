; Handset ESP-MESH auto-root integration (ESP32-S3 N16R8): handset_broadcast_
; integration_test (D-pad + ST7789 menu, connections between pre-paired
; handsets, push-to-talk Opus voice end-to-end encrypted over ESP-NOW or
; ESP-WIFI-MESH, LoRa hello/bye texts, broadcasts) without the ESP-NOW
; flood mesh and routed relay. No router: the boards elect the ESP-MESH
; root over ESP-NOW (idle first, then most boards heard, then lowest ID).
; The mesh is part of the framework (esp_mesh.h), so no extra library.
; Keys are compiled in (../shared_keys), so there is no pairing step. Every
; board runs the same firmware; build the environment for the board's ID.
[platformio]
default_envs = board1, board2, board3, board4, board5

[env]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
upload_speed = 460800
; These boards require manual BOOT + RESET before uploading.
board_upload.before_reset = no_reset

; Quad-SPI flash + Octal-SPI PSRAM. Override the stock N8 board defaults.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Keys shared by every project: ../shared_keys/e2e_keys.h
    -I$PROJECT_DIR/../shared_keys

lib_deps =
    https://github.com/pschatzmann/arduino-libopus.git#bae0f8570b03071d0101445059e7178bed8bd144
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    jgromes/RadioLib@7.7.1

[env:board1]
build_flags = ${env.build_flags} -DE2E_DEVICE_ID=1

[env:board2]
build_flags = ${env.build_flags} -DE2E_DEVICE_ID=2

[env:board3]
build_flags = ${env.build_flags} -DE2E_DEVICE_ID=3

[env:board4]
build_flags = ${env.build_flags} -DE2E_DEVICE_ID=4

[env:board5]
build_flags = ${env.build_flags} -DE2E_DEVICE_ID=5
