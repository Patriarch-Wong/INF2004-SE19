; ESP-NOW relay without the end-to-end key (ESP32-S3 N16R8).
; Handsets 1 and 2 send through board 3, which holds only the network key.
[platformio]
default_envs = board1, board2, board3-relay

[env]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
upload_speed = 460800
; These boards require manual BOOT + RESET before uploading.
board_upload.before_reset = no_reset

; Quad-SPI flash + Octal-SPI PSRAM. Override the stock N8 board defaults.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM

build_src_filter = +<*> -<relay.cpp>

lib_deps =

; Serial over the USB-to-UART bridge (usually the UART connector).
[uart]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

; Serial over the chip's native USB Serial/JTAG controller.
[usb]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; Handsets: every frame goes to the relay's MAC.
[env:board1]
build_flags = ${uart.build_flags} -DE2E_DEVICE_ID=1

[env:board2]
build_flags = ${uart.build_flags} -DE2E_DEVICE_ID=2

; Latency baseline only: handsets send straight to each other.
[env:board1-direct]
build_flags = ${env:board1.build_flags} -DE2E_DIRECT

[env:board2-direct]
build_flags = ${env:board2.build_flags} -DE2E_DIRECT

; Relay: no main.cpp and no pair keys; key_store.h exposes only the
; network key under E2E_RELAY.
[relay]
build_src_filter = -<*> +<relay.cpp> +<secure_message.cpp>
    +<crypto_backend_mbedtls.cpp>
build_flags = ${uart.build_flags} -DE2E_DEVICE_ID=3 -DE2E_RELAY

[env:board3-relay]
build_src_filter = ${relay.build_src_filter}
build_flags = ${relay.build_flags}

; Negative test: flips a ciphertext bit and re-signs the hop.
[env:board3-relay-tamper]
build_src_filter = ${relay.build_src_filter}
build_flags = ${relay.build_flags} -DE2E_RELAY_TAMPER
