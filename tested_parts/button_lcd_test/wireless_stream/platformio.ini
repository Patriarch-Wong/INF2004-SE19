[platformio]
default_envs = sender

[env]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
board_upload.before_reset = no_reset
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
extra_scripts = pre:tools/build_flags.py
build_flags =
    -DBOARD_HAS_PSRAM
    -fno-exceptions
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0

[env:sender]
build_flags =
    ${env.build_flags}
    -DAPP_RECEIVER=0
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:receiver]
build_flags =
    ${env.build_flags}
    -DAPP_RECEIVER=1
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:sender-usb]
build_flags =
    ${env.build_flags}
    -DAPP_RECEIVER=0
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:receiver-usb]
build_flags =
    ${env.build_flags}
    -DAPP_RECEIVER=1
    -DARDUINO_USB_CDC_ON_BOOT=1
