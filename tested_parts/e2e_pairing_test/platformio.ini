; ESP-NOW pairing, pair keys in NVS and per-boot session keys (ESP32-S3
; N16R8). All three boards are handsets; only the network key is compiled in.
[platformio]
default_envs = board1, board2, board3

[env]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
upload_speed = 460800
; These boards require manual BOOT + RESET before uploading.
board_upload.before_reset = no_reset

; Quad-SPI flash + Octal-SPI PSRAM. Override the stock N8 board defaults.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM

build_src_filter = +<*> -<pairing_mitm.cpp>

lib_deps =

; Serial over the USB-to-UART bridge (usually the UART connector).
[uart]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:board1]
build_flags = ${uart.build_flags} -DE2E_DEVICE_ID=1

[env:board2]
build_flags = ${uart.build_flags} -DE2E_DEVICE_ID=2

[env:board3]
build_flags = ${uart.build_flags} -DE2E_DEVICE_ID=3

; Negative test: resends the last frame of an old session to device 2 after
; device 2 has rebooted into a new session.
[env:board1-replay-old-session]
build_flags = ${env:board1.build_flags} -DE2E_TEST_OLD_SESSION

; Negative test: poses as device 2 to device 1 and as device 1 to device 2
; during pairing. No main.cpp and no session code.
[env:board3-pair-mitm]
build_src_filter = -<*> +<pairing_mitm.cpp> +<radio.cpp> +<pairing.cpp>
    +<kdf.cpp> +<control_frame.cpp> +<secure_message.cpp>
    +<crypto_backend_mbedtls.cpp>
build_flags = ${uart.build_flags}
