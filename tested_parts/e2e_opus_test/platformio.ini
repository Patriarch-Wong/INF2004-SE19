; Stage 6: Opus voice over the stage 4/5 end-to-end link (ESP32-S3 N16R8).
; Boards 1 and 2 are handsets; only the network key is compiled in. Board 3
; is the keyless stage 5 sniffer.
[platformio]
default_envs = board1, board2, board1-plain, board2-plain, board3-sniff

[env]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
upload_speed = 460800
; These boards require manual BOOT + RESET before uploading.
board_upload.before_reset = no_reset

; Quad-SPI flash + Octal-SPI PSRAM. Override the stock N8 board defaults.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM

build_src_filter = +<*> -<sniffer.cpp>

lib_deps =
    https://github.com/pschatzmann/arduino-libopus.git#bae0f8570b03071d0101445059e7178bed8bd144

; Serial over the USB-to-UART bridge (usually the UART connector).
[uart]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:board1]
build_flags = ${uart.build_flags} -DE2E_DEVICE_ID=1

[env:board2]
build_flags = ${uart.build_flags} -DE2E_DEVICE_ID=2

[env:board1-plain]
build_flags = ${env:board1.build_flags} -DE2E_PLAIN

[env:board2-plain]
build_flags = ${env:board2.build_flags} -DE2E_PLAIN

[env:board3-sniff]
build_src_filter = -<*> +<sniffer.cpp> +<sniff_frame.cpp>
build_flags = ${uart.build_flags}
lib_deps =
