; Encrypted live camera over ESP-NOW: espcam_espnow_live_test with every
; packet sealed under the 1-2 session key. Board 1 (ESP32-S3 N16R8 CAM,
; OV5640) sends small JPEG frames to board 2 (ST7789 240 x 240 LCD), which
; scales them up to the screen. Keys come from ../shared_keys/e2e_keys.h.
[platformio]
default_envs = camera, display

[env]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
upload_speed = 460800
; These boards require manual BOOT + RESET before uploading.
board_upload.before_reset = no_reset

; Quad-SPI flash + Octal-SPI PSRAM. Override the stock N8 board defaults.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; Keys shared by every project: ../shared_keys/e2e_keys.h
    -I$PROJECT_DIR/../shared_keys

; Board 1, camera. Serial on the UART USB-C connector.
[env:camera]
build_flags =
    ${env.build_flags}
    -DAPP_CAMERA=1
    -DE2E_DEVICE_ID=1
    -DARDUINO_USB_CDC_ON_BOOT=0

; Board 1, camera. Serial on the native USB connector.
[env:camera-usb]
build_flags =
    ${env.build_flags}
    -DAPP_CAMERA=1
    -DE2E_DEVICE_ID=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Board 2, display.
[env:display]
build_flags =
    ${env.build_flags}
    -DAPP_CAMERA=0
    -DE2E_DEVICE_ID=2
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
